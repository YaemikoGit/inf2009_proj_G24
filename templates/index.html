<html>
  <head>
    <title>Smart Classroom Dashboard</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f4f6f9;
      }

      h1 {
        text-align: center;
        padding: 20px;
        background-color: #1f2937;
        color: white;
        margin: 0;
      }

      .container {
        display: flex;
        padding: 20px;
        gap: 20px;
      }

      .left-panel {
        flex: 2;
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      }

      .right-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .card {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      }

      .status {
        font-size: 20px;
        font-weight: bold;
        margin-top: 10px;
      }

      .light-on {
        color: green;
      }

      .light-off {
        color: red;
      }

      img {
        width: 100%;
        border-radius: 10px;
      }
    </style>
  </head>

  <body>
    <h1>Smart Classroom Dashboard</h1>

    <div class="container">
      <div class="left-panel">
        <h2>Live Camera Feed</h2>
        <img src="{{ url_for('video_feed') }}" />
      </div>

      <div class="right-panel">
        <div class="card">
          <h2>Light Sensor</h2>
          <div id="lightStatus" class="status">Loading...</div>
        </div>
      </div>
    </div>

    <script>
      function updateLight() {
        fetch("/light")
          .then((response) => response.json())
          .then((data) => {
            const statusElement = document.getElementById("lightStatus");

            if (data.light) {
              statusElement.innerText = "Lights ON";
              statusElement.className = "status light-on";
            } else {
              statusElement.innerText = "Lights OFF";
              statusElement.className = "status light-off";
            }
          })
          .catch(() => {
            document.getElementById("lightStatus").innerText =
              "Error reading sensor";
          });
      }

      setInterval(updateLight, 5000);
      updateLight();
    </script>
  </body>
</html>
